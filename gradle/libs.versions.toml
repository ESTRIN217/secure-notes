[versions]
agp = "9.4.1"
coreKtx = "1.19.0"
junit = "6.1.2"
# JUnit 4 es el framework con el que están escritas todas las pruebas del repo. `junit` (arriba) es el de
# Jupiter, que no llega al classpath de ejecución sin `useJUnitPlatform()`; este alias existe para que un módulo
# **puro** (sin Robolectric, que es lo que arrastraba el 4 de forma transitiva) pueda declarar el suyo.
junit4 = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
lifecycleRuntimeKtx = "2.11.0"
lifecycleViewmodelCompose = "2.11.0"
lifecycleRuntimeCompose = "2.11.0"
