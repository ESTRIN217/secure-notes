media3 = "1.7.1"
glance = "1.3.0-alpha02"
# commonmark-java ya **no se declara**: la spec 019 quito las tres declaraciones de `:editor-de-codigo`
# al borrarse el generador de HTML. Sigue dentro del APK, y ahora **por una sola via**: `markwon-core`
# lo exige en `compile` y lo arrastra a 0.13.0. Antes habia tres caminos que podian moverlo —la
# libreria de Markdown de terceros (retirada en la 018) y el generador de HTML (borrado en la 019)— y
# ahora no hay ninguno, asi que su version es cosa de `markwon-core` y de nadie mas.
# Motor de GFM de toda superficie de Markdown (spec 017, RF-98; spec 018, RF-104, RF-105). Estas seis
# piezas YA estaban en el APK como dependencia `runtime` de la libreria que la 018 retira; se declaran
# aqui porque una dependencia `runtime` no llega al classpath de compilacion. Cero jars nuevos:
# RNF-48, RNF-53.
markwon = "4.6.2"

