# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
android.nonTransitiveRClass=true
kotlin.code.style=official
kotlin.compiler.execution.strategy=daemon
kotlin.incremental=false
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configureondemand=false
org.gradle.daemon=true
org.gradle.daemon.idletimeout=10800000
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=682m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Dorg.gradle.warning.mode=(all)
org.gradle.parallel=true
org.gradle.workers.max=2
roborazzi.test.verify=true
systemProp.TMPDIR=data/user/0/com.nullij.androidcodestudio/files/home/tmp
systemProp.file.encoding=UTF-8
systemProp.sun.jnu.encoding=UTF-8
systemProp.user.country=US
systemProp.user.language=en
# AGP's aapt2 "optimize" pass (OptimizeResourcesTask) silently produces nothing on this
# project: it scans its input directory for a file ending in .ap_/.apk, finds none, and
# reports BUILD SUCCESSFUL without writing the artifact. The optimized .ap_ carries the
# compiled AndroidManifest.xml, so without it the release APK is packaged with no manifest,
# no resources.arsc and no res/ at all — unusable. Disable it until it works.
android.enableResourceOptimizations=false
