<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada — Secure Notes</title>
<meta name="description" content="La página que buscas no existe en el sitio de Secure Notes.">
<meta name="theme-color" content="#0b0d14">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<!-- Autocontenida a propósito: Firebase sirve este documento para cualquier ruta, así que no puede depender de rutas relativas. -->
<style>
  :root { --bg:#0b0d14; --surface:#141a2c; --border:#26304a; --text:#e9ecf6; --muted:#9aa4bf; --gold:#edc22e; --accent:#7c6cff; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 28px;
    background: radial-gradient(760px 420px at 20% 0%, rgba(124,108,255,.26), transparent 70%), var(--bg);
    color: var(--text); font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; line-height: 1.6;
  }
  main { max-width: 520px; text-align: center; padding: 40px 28px; border: 1px solid var(--border); border-radius: 18px; background: var(--surface); }
  .code { margin: 0; font-size: 3.4rem; font-weight: 800; color: var(--gold); letter-spacing: -.04em; }
  h1 { margin: 6px 0 12px; font-size: 1.5rem; }
  p { margin: 0 0 26px; color: var(--muted); }
  a.btn {
    display: inline-block; padding: 12px 22px; border-radius: 999px; font-weight: 600; text-decoration: none;
    color: #0b0d14; background: linear-gradient(120deg, var(--accent), #a06bff 60%, var(--gold));
  }
  a.btn:hover { text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <p class="code">404</p>
  <h1>Esta página no existe</h1>
  <p>Puede que el enlace esté roto o que la página se haya movido. Vuelve a la portada para conocer Secure Notes.</p>
  <a class="btn" href="/">Ir a la portada</a>
</main>
</body>
</html>
